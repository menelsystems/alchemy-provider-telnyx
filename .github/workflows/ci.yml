name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      # Typecheck, format check, unit tests and the stack test against an
      # in-memory fake of the Telnyx API. No credentials needed.
      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      # Installs the packed tarball with plain npm and loads it under Node.
      - name: Smoke test the packed tarball
        run: bun run smoke
